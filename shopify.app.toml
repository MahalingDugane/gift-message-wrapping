embedded = true

name = "Gift Message & Wrapping"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
uri = "/webhooks"
compliance_topics = [
  "customers/data_request",
  "customers/redact",
  "shop/redact"
]

[access_scopes]
scopes = "read_customers,read_orders,read_products,write_products"

[auth]
redirect_urls = [
  "https://gift-message-wrapping-7rdk.vercel.app/auth/callback",
  "https://gift-message-wrapping-7rdk.vercel.app/auth/shopify/callback",
  "https://gift-message-wrapping-7rdk.vercel.app/api/auth/callback"
]

[build]
automatically_update_urls_on_dev = true

[app_proxy]
url = "/api/gift-settings"
prefix = "apps"
subpath = "gift-settings"
